<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="starMedalG" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
    <filter id="shMedal"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.45"/></filter>
  </defs>
  <g filter="url(#shMedal)">
    <!-- Circular Gold Medal -->
    <circle cx="50" cy="50" r="42" fill="url(#starMedalG)" stroke="#854d0e" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="34" fill="#a16207" stroke="#ffffff" stroke-width="1"/>
    <circle cx="50" cy="50" r="32" fill="url(#starMedalG)"/>
    <!-- 5-Pointed Star -->
    <polygon points="50,24 57,39 74,40 61,51 65,68 50,59 35,68 39,51 26,40 43,39" fill="#ffffff" stroke="#a16207" stroke-width="1.5"/>
  </g>
</svg>