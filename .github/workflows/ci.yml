name: CI

# Quality gate for type-checking, linting, and tests.
#
# This workflow is the ONLY type gate for apps/builder: `next build` runs with
# `typescript.ignoreBuildErrors: true` (see apps/builder/next.config.ts), so
# `turbo run check-types` here must stay green — never remove it without
# re-enabling type-checking inside the build.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Must stay BEFORE actions/setup-node so its `cache: pnpm` can resolve
      # the pnpm binary to locate the store. v6 drops the deprecated Node 20
      # runtime; the version itself comes from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo remote cache backed by the GitHub Actions cache (zero infra).
      # Sets TURBO_API/TURBO_TOKEN/TURBO_TEAM for the steps below.
      - name: Set up Turbo cache
        uses: rharkor/caching-for-turbo@v2.5.1

      # Budget: turbo concurrency x vitest maxWorkers <= 4 vCPU. The vitest
      # preset uses maxWorkers=2 on CI (packages/vitest-config/src/node.ts),
      # so concurrency=2 fills the runner without oversubscribing. Turbo
      # concurrency does not parallelize within a suite, so spending the
      # budget on vitest workers shortens the critical path (builder, 248
      # files); spending it on more concurrent tasks does not.
      - name: Type-check, lint, and test
        run: pnpm turbo run check-types lint test --concurrency=2
