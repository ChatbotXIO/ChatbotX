name: CI

# Quality gate for type-checking, linting, and tests.
#
# The `check-types` job is the ONLY type gate for apps/builder: `next build`
# runs with `typescript.ignoreBuildErrors: true` (see apps/builder/next.config.ts),
# so `turbo run check-types` here must stay green — never remove it without
# re-enabling type-checking inside the build.
#
# The three phases run as separate jobs rather than one `turbo run` invocation.
# They are independent, so splitting gives each its own 4-vCPU runner (~3x the
# total CPU) and makes wall clock the slowest phase instead of their sum. It
# also lets each pick its own concurrency: tsc is single-threaded and CPU-bound,
# while vitest parallelizes internally and must stay within the vCPU budget.
#
# `workflow_call` lets release.yml run this exact gate (same shards, same
# concurrency, same turbo passthrough args, so the same cache keys) before it
# publishes an image for a tag or a manual dispatch. Keep the quality gate
# defined once, here — release.yml's `check` job explains why its own
# single-runner gate was retired.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# Read-only: these jobs only check out, install, and run local scripts —
# none of them need to write contents, packages, or PR/issue state.
permissions:
  contents: read

# Inside a called workflow the `github` context is the caller's, so a
# release.yml `workflow_dispatch` on main would otherwise share the group of
# the push-to-main run and cancel it. `github.workflow` is the caller's name
# there ("Build and Push Docker Images"), which keeps the two apart.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type-checking is split across two runners. Every workspace resolves
  # `@chatbotx.io/*` to raw source, so each `tsc` re-checks the shared
  # database/business graph itself: the 65 tasks summed ~284s locally, with
  # builder (48s) and worker (19s) the largest, and one 4-vCPU runner took
  # ~450s on a full run. builder + worker on one runner and the other 63 on
  # the second balance roughly evenly; the two filters partition every task.
  check-types-shard:
    name: Types (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - group: apps
            filter: --filter=builder --filter=worker
          - group: packages
            filter: --filter=!builder --filter=!worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Must stay BEFORE actions/setup-node so its `cache: pnpm` can resolve
      # the pnpm binary to locate the store. v6 drops the deprecated Node 20
      # runtime; the version itself comes from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo remote cache backed by the GitHub Actions cache (zero infra).
      # Sets TURBO_API/TURBO_TOKEN/TURBO_TEAM for the steps below.
      - name: Set up Turbo cache
        uses: rharkor/caching-for-turbo@v2.5.2

      # `--incremental` (below) leaves a tsbuildinfo next to every tsconfig.
      # Restoring the newest one from earlier runs lets each `tsc` re-check
      # only files whose content changed since: a package turbo re-runs only
      # because a dependency's hash moved (a config or lockfile change makes
      # every task miss) finishes in a fraction of a cold check — measured on
      # worker: 16.8s cold, 3.9s with no source change. tsc validates every
      # file by content hash and ignores a buildinfo from another TS version,
      # so a stale cache can only cost time, never hide an error.
      - name: Restore tsbuildinfo
        uses: actions/cache@v6
        with:
          path: |
            apps/*/*.tsbuildinfo
            packages/*/*.tsbuildinfo
            integrations/*/*.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ matrix.group }}-${{ github.sha }}
          restore-keys: tsbuildinfo-${{ runner.os }}-${{ matrix.group }}-

      # Independent `tsc --noEmit` runs: no type-check task waits for another
      # (no `composite`/`references` in this repo — see turbo.json).
      # Each is single-threaded, so concurrency can fill all 4 vCPUs.
      - name: Type-check
        run: pnpm turbo run check-types --concurrency=4 ${{ matrix.filter }} -- --incremental

  # One stable "Types" result for branch rules and the PR checks list.
  check-types:
    name: Types
    needs: check-types-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every type-check shard to pass
        run: test "${{ needs.check-types-shard.result }}" = "success"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Turbo cache
        uses: rharkor/caching-for-turbo@v2.5.2

      # Root `pnpm lint` runs cheapest-first: check:agent-instructions, then
      # `turbo run lint` (apps/builder's i18n key-parity check plus 57
      # <NONEXISTENT> placeholders), then the slowest step — repo-wide Biome
      # (biome.json globs apps/**, packages/**, integrations/**). One script
      # covers everything; no separate turbo invocation needed.
      - name: Lint
        run: pnpm lint

  # Tests are split into eight shards, each on its own 4-vCPU runner. Import cost,
  # not test bodies, dominates every suite (business measured `import 2812s`
  # vs `tests 86s` on CI), and a change to `database` or `business` makes
  # nearly every workspace affected — run serially, the suites summed past the
  # 30-minute timeout before builder and database had even started.
  # `vitest --shard` splits each suite's files evenly, so every shard runs an
  # eighth of every affected suite. Each shard pays ~1 minute of fixed setup
  # (checkout, pnpm, install), so past eight shards that overhead dominates.
  # A suite with fewer files than shards simply finds no files in some shards
  # (`--passWithNoTests`). Turbo hashes the passthrough args, so each shard
  # caches separately.
  test-shard:
    name: Tests (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        total: [8]
    steps:
      # `turbo run --affected` diffs the PR merge commit against its first
      # parent (see below), so depth 2 (the merge commit plus its parents) is
      # enough. A full-history clone cost ~30s per shard.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Turbo cache
        uses: rharkor/caching-for-turbo@v2.5.2

      # PRs run only suites whose workspace or dependency graph is affected.
      # Explicit SHAs avoid Turbo choosing an ambiguous base ref. Pushes to
      # main retain the complete suite, so cross-workspace regressions are
      # still caught before a release.
      #
      # The checkout is the PR merge commit, built on the *current* main tip.
      # `pull_request.base.sha` is not: it stays at the main commit the branch
      # was last synced with, so diffing against it pulls in every main commit
      # merged since — root package.json/lockfile/turbo.json included — and
      # turbo marks every workspace affected. The merge commit's first parent
      # is exactly the main tip the PR was merged onto.
      - name: Test affected workspaces
        if: github.event_name == 'pull_request'
        run: |
          export TURBO_SCM_BASE="$(git rev-parse HEAD^1)"
          export TURBO_SCM_HEAD="$(git rev-parse HEAD)"
          pnpm turbo run test --affected --concurrency=2 -- --shard=${{ matrix.shard }}/${{ matrix.total }}

      # Turbo does not parallelize *within* a suite, so wall clock is bounded
      # by the slowest single suite — builder (248 files), which is ~40% of
      # total test CPU and scales to 4 vitest workers (see the measurements in
      # packages/vitest-config/src/node.ts). The preset gives each suite 4
      # workers on the `threads` pool.
      #
      # concurrency=2 slightly oversubscribes the 4 vCPUs by design: the 55
      # other suites are small and mostly I/O- and import-bound, so letting one
      # overlap builder fills the box while builder still gets the cores it
      # needs. Measured end-to-end on the full 56-suite run: concurrency=1
      # 170s, =2 123s, =4 101s (on a 12-core box, so CI compresses these) —
      # =1 serializes 55 small suites to help only builder, while =4 would
      # contend with builder's own workers on a 4-vCPU runner.
      #
      # `github.event_name` is the caller's event when this workflow is
      # reused, so a release tag push and a `workflow_dispatch` both land
      # here and run the complete suite.
      - name: Test all workspaces
        if: github.event_name != 'pull_request'
        run: pnpm turbo run test --concurrency=2 -- --shard=${{ matrix.shard }}/${{ matrix.total }}

  # One stable "Tests" result for branch rules and the PR checks list,
  # whatever the shard count.
  test:
    name: Tests
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        run: test "${{ needs.test-shard.result }}" = "success"
