# Deploy devel — ChatbotX (estilo sysbrazo)
#
# Corre en push a main (después de merge de PR).
# workflow_dispatch manual:
#   maintenance_on  — maintenance sin deploy
#   maintenance_off — restaura tráfico
#
# El deploy real lo hace el script deploy-devel.sh que vive EN EL SERVER
# (como deploy-v3.sh de sysbrazo). El workflow solo se conecta y lo ejecuta.
# Las credenciales de AWS las tiene la instancia EC2 (IAM role).

name: Deploy Devel

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      job:
        description: Manual maintenance action
        type: choice
        required: true
        options:
          - maintenance_on
          - maintenance_off

concurrency:
  group: chatbotx-devel
  cancel-in-progress: false

env:
  ENV: devel
  WORKSPACE: /var/www/chatbotx-dev
  SERVER: ip-10-6-3-11.us-west-2.compute.internal
  SSH_USER: sysbrazo
  HUSKY: "0"

jobs:
  maintenance_on:
    name: Maintenance on
    if: |
      always() &&
      (
        (github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'maintenance_on')
      )
    runs-on: [self-hosted, gl-runner01]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable maintenance
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SERVER} \
            "touch ${WORKSPACE}/.maintenance"

  deploy:
    name: Deploy + smoke
    needs: [maintenance_on]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.maintenance_on.result == 'success'
    runs-on: [self-hosted, gl-runner01]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SERVER} \
            "cd ${WORKSPACE} && git pull --ff-only && ./scripts/deployment/deploy-devel.sh"

      - name: Smoke test
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SERVER} \
            "curl -sf -o /dev/null -w 'HTTP %{http_code}\n' http://localhost:3123/api/health"

  maintenance_off:
    name: Maintenance off
    needs: [deploy]
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.deploy.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'maintenance_off')
      )
    runs-on: [self-hosted, gl-runner01]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable maintenance
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SERVER} \
            "rm -f ${WORKSPACE}/.maintenance"
