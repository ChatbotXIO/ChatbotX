name: Publish CLI to npm

# Publishes apps/cli to npmjs.com as `chatbotx`, in lockstep with the product
# release tag: tag `v1.9.0` publishes `chatbotx@1.9.0`.
#
# The version is NOT stored in the repo. `apps/cli/package.json` holds the
# placeholder `0.0.0-dev` and this workflow stamps the tag's version into it
# before building, so nothing has to commit a version bump back to `main`
# (which branch protection forbids) and the repo can never drift from npm.
# `apps/cli/src/index.ts` reads that stamped value for `chatbotx --version`.
#
# Quality gate: ci.yml (PR/push-to-main) and release.yml's `check` job already
# run the repo-wide lint/types/test. This workflow cannot `needs:` a job in
# another workflow file, so it re-runs only the two CLI-scoped tasks, which
# cost seconds.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.9.1 (a leading v is stripped)"
        required: true
        type: string
      dry_run:
        description: "Run publish with --dry-run (nothing is uploaded)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

# cancel-in-progress is deliberately false: a cancelled run between the npm
# upload and the step summary leaves a published version nobody announced.
concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish chatbotx
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      # No `registry-url:` here on purpose — that makes setup-node write its own
      # npmrc via NPM_CONFIG_USERCONFIG, which pnpm does not reliably honour.
      # The publish step writes ~/.npmrc itself instead.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # OIDC trusted publishing (below) is delegated by `pnpm publish` to the
      # npm CLI and requires npm >= 11.5.1. Node 24's bundled npm can lag that.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version and dist-tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RAW="${INPUT_VERSION}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '${RAW}' — expected v<major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          # A prerelease tag (v2.0.0-rc.1) must never become npm's `latest`.
          if [[ "${VERSION}" == *-* ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing chatbotx@${VERSION} under dist-tag ${DIST_TAG}"

      # Re-running a tag's workflow must not fail on E403 "cannot publish over
      # an existing version". Only guarded for tag pushes: a manual dispatch is
      # an explicit human action and should surface the duplicate as an error.
      - name: Skip when already published
        id: guard
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "chatbotx@${VERSION}" version >/dev/null 2>&1; then
            echo "chatbotx@${VERSION} is already on npm — skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      # jq ships on ubuntu-latest. Not committed anywhere — the runner's copy of
      # package.json is the only thing that changes.
      - name: Stamp version into apps/cli/package.json
        if: steps.guard.outputs.should_publish != 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "${VERSION}" '.version = $v' apps/cli/package.json > package.json.tmp
          mv package.json.tmp apps/cli/package.json
          node -e "console.log('stamped version:', require('./apps/cli/package.json').version)"

      - name: Type-check and test CLI
        if: steps.guard.outputs.should_publish != 'false'
        working-directory: apps/cli
        run: |
          pnpm check-types
          pnpm test

      # Direct `tsdown` rather than `turbo run build`: the stamped package.json
      # must be inside the bundle, and this sidesteps any turbo cache question
      # entirely. Never `pnpm --filter chatbotx` — the private root package is
      # ALSO named `chatbotx`, so that selector matches two projects.
      - name: Build CLI
        if: steps.guard.outputs.should_publish != 'false'
        working-directory: apps/cli
        run: pnpm build

      - name: Publish to npm
        if: steps.guard.outputs.should_publish != 'false'
        working-directory: apps/cli
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--access public --no-git-checks --tag "${DIST_TAG}")
          # --no-git-checks: a tag build is a detached HEAD with a modified
          # package.json, both of which pnpm otherwise refuses to publish from.
          if [[ "${DRY_RUN}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          pnpm publish "${ARGS[@]}"

      - name: Summarize
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          SHOULD_PUBLISH: ${{ steps.guard.outputs.should_publish }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "${SHOULD_PUBLISH}" == "false" ]]; then
            echo "chatbotx@${VERSION} already published — skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${DRY_RUN}" == "true" ]]; then
            echo "Dry run for chatbotx@${VERSION} (${DIST_TAG}) — nothing uploaded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published https://www.npmjs.com/package/chatbotx/v/${VERSION} (dist-tag \`${DIST_TAG}\`)" >> "$GITHUB_STEP_SUMMARY"
          fi
