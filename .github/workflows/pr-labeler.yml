name: PR Labeler

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply label from PR title
        uses: actions/github-script@v9
        with:
          script: |
            const TYPE_MAP = [
              { re: /^feat(\([^)]+\))?!/,              labels: ['feature', 'breaking-change'] },
              { re: /^feat(\([^)]+\))?:/,              labels: ['feature'] },
              { re: /^(fix|bugfix)(\([^)]+\))?!/,      labels: ['bug', 'breaking-change'] },
              { re: /^(fix|bugfix)(\([^)]+\))?:/,      labels: ['bug'] },
              { re: /^(refactor|perf)(\([^)]+\))?!/,   labels: ['improvement', 'breaking-change'] },
              { re: /^(refactor|perf)/,                labels: ['improvement'] },
              { re: /^docs/,                           labels: ['docs'] },
              { re: /^chore/,                          labels: ['chore'] },
              { re: /^ci/,                             labels: ['ci'] },
              { re: /^security/,                       labels: ['security'] },
              { re: /^build\(deps\)|^chore\(deps\)/,   labels: ['dependencies'] },
            ];

            const title = context.payload.pull_request && context.payload.pull_request.title;
            const match = title ? TYPE_MAP.find(({ re }) => re.test(title)) : undefined;
            const labels = match ? [...match.labels] : [];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const hotPathPatterns = [
              /^packages\/analytics\/src\/repositories\//,
              /^packages\/business\/src\/quota-enforcement\//,
              /^apps\/worker\/src\/integration\/handlers\/received-message\.ts$/,
              /^apps\/worker\/src\/chat\//,
            ];
            if (files.some(({ filename }) => hotPathPatterns.some((pattern) => pattern.test(filename)))) {
              const hotPathLabel = 'hot-path:messaging';
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: hotPathLabel,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: hotPathLabel,
                    color: 'B60205',
                    description: 'Changes messaging delivery hot paths',
                  });
                } catch (createError) {
                  if (createError.status !== 422) {
                    throw createError;
                  }
                }
              }
              labels.push(hotPathLabel);
            }

            if (labels.length === 0) {
              console.log(`No labels to apply to: ${title ?? '<missing title>'}`);
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [...new Set(labels)],
            });

            console.log(`Applied labels [${[...new Set(labels)].join(', ')}] to PR #${context.payload.pull_request.number}`);

