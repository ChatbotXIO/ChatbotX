name: chatbotx

include:
  - docker-compose.yml

x-service-common: &service-common
  platform: linux/amd64
  restart: unless-stopped
  env_file:
    - ./.env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - chatbotx-network

x-worker-common: &worker-common
  <<: *service-common
  build:
    context: .
    dockerfile: apps/worker/docker/Dockerfile

services:
  builder:
    <<: *service-common
    # image: chatbotx-builder:latest
    build:
      context: .
      dockerfile: apps/builder/docker/Dockerfile
      args:
        # Rebuilds reuse Turbopack's cache from the BuildKit mount (see Dockerfile).
        NEXT_BUILD_FS_CACHE: "true"
    ports:
      - "3123:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      filesystem:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - RUN_DB_MIGRATE=true
      - RUN_DB_SEED=true
      - REALTIME_INTERNAL_URL=http://realtime:1999

  # BullMQ Worker: the image default `worker standalone` — every core queue
  # consumer plus the schedule (cron) worker in ONE process, instead of one
  # process per worker (`worker all`, ~3.9GB).
  worker:
    <<: *worker-common
    networks:
      - chatbotx-network
      - javascript-executor-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      filesystem:
        condition: service_healthy
      javascript-executor:
        condition: service_healthy
    environment:
      - JAVASCRIPT_EXECUTOR_URL=http://javascript-executor:3210
      - REALTIME_INTERNAL_URL=http://realtime:1999

  # Sequence scheduler needs Kafka (KAFKA_BROKERS), which this stack does not
  # run — see packages/kafka/docker-compose.yml. Opt in with
  # `docker compose --profile sequence up`.
  worker-sequence-scheduler:
    <<: *worker-common
    profiles: ["sequence"]
    command: ["worker", "sequence-scheduler"]
  worker-sequence-producer:
    <<: *worker-common
    profiles: ["sequence"]
    command: ["worker", "sequence-producer"]
  worker-sequence-consumer:
    <<: *worker-common
    profiles: ["sequence"]
    command: ["worker", "sequence-consumer"]

  javascript-executor:
    platform: linux/amd64
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/javascript-executor/docker/Dockerfile
    environment:
      JAVASCRIPT_EXECUTOR_TOKEN: ${JAVASCRIPT_EXECUTOR_TOKEN:-change-me-in-production-at-least-32-chars}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-2}
    networks:
      - javascript-executor-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
          pids: 128
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  realtime:
    <<: *service-common
    build:
      context: .
      dockerfile: apps/realtime/docker/Dockerfile
    ports:
      - "1999:1999"

networks:
  javascript-executor-network:
    driver: bridge
    internal: true
