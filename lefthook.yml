post-checkout:
  jobs:
    - name: branch-name
      run: sh scripts/git-hooks/check-branch-name.sh

pre-commit:
  jobs:
    # Only the staged files: a bare `ultracite fix` rewrote the whole repo.
    - run: pnpm ultracite fix {staged_files}
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      stage_fixed: true
      skip: [merge, rebase]
    # Only workspaces changed since HEAD (staged + unstaged) and their
    # dependents, two tsc at a time like the root `check-types` script. A bare
    # `turbo check-types` ran all 64 workspaces at turbo's default concurrency
    # of 10, with builder alone allowed an 8 GB heap.
    - name: typecheck
      run: pnpm turbo check-types --filter="...[HEAD]" --concurrency=2
      # Test files are type-checked by default. Export CHECK_TYPES_SKIP_TESTS=1
      # locally to skip them in builder (~10% faster, ~1 GB lighter); CI still
      # checks them.
      glob: "**/*.{ts,tsx}"
      # A merge from main stages every file main changed; CI type-checks it.
      skip: [merge, rebase]

commit-msg:
  jobs:
    - run: sh scripts/git-hooks/check-commit-msg.sh '{1}'
