post-checkout:
  jobs:
    - name: branch-name
      run: sh scripts/git-hooks/check-branch-name.sh

pre-commit:
  jobs:
    - run: pnpm ultracite fix
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      stage_fixed: true
    - name: typecheck
      run: pnpm turbo check-types
      glob: "**/*.{ts,tsx}"

commit-msg:
  jobs:
    - run: sh scripts/git-hooks/check-commit-msg.sh '{1}'
