# coturn TURN server config for agent softphone ICE relay
# (production-only — local dev uses host ICE candidates directly).
#
# Params used: listening-port, tls-listening-port, min-port, max-port,
# fingerprint, use-auth-secret, static-auth-secret, realm, cert, pkey,
# external-ip.
#
# ${FS_SIP_DOMAIN}, ${FS_PUBLIC_IP}, ${TURN_STATIC_SECRET} below are NOT
# expanded by coturn itself (coturn does not do env-var substitution in
# this file) — the compose `command` passes the secret and realm via CLI
# flags instead (`-c ... --static-auth-secret=$TURN_STATIC_SECRET
# --realm=$FS_SIP_DOMAIN`), which override the placeholder lines below.
# `realm=`/`external-ip=` must still be hand-set to the deployment's real
# values before starting coturn in production.

listening-port=3478
tls-listening-port=5349

# TURN relay range (must be published/open on the host). This is coturn's
# own UDP relay allocation range and is intentionally DISJOINT from the
# FreeSWITCH RTP range (16384-32768 in production) — both must be open on
# the firewall.
min-port=49152
max-port=65535

fingerprint

# RFC 5766-style time-limited credentials minted by
# getSoftphoneCredentialsAction from TURN_STATIC_SECRET — no
# static username/password list.
use-auth-secret
static-auth-secret=CHANGE_ME_TURN_STATIC_SECRET

realm=CHANGE_ME_FS_SIP_DOMAIN

# Same certificate as the FreeSWITCH wss/whatsapp TLS listeners (one CA
# cert -> agent.pem, wss.pem, coturn).
cert=/etc/coturn/certs/wss.pem
pkey=/etc/coturn/certs/wss.key

# Set to this host's real public IP in production.
# external-ip=CHANGE_ME_FS_PUBLIC_IP

no-cli
no-tlsv1
no-tlsv1_1
