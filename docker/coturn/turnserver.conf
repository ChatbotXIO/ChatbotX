# coturn TURN server config for in-app WhatsApp VoIP calling (browser WebRTC
# ICE relay). Production-only — local dev uses host ICE candidates directly.
#
# Params used: listening-port, tls-listening-port, min-port, max-port,
# fingerprint, use-auth-secret, static-auth-secret, realm, cert, pkey,
# external-ip.
#
# coturn does not expand env vars in this file — the compose `command` passes
# the secret and realm as CLI flags (`--static-auth-secret=$TURN_STATIC_SECRET
# --realm=$TURN_REALM`), which override the placeholder lines below.
# `realm=`/`external-ip=` must still be hand-set to the deployment's real
# values before starting coturn in production.

listening-port=3478
tls-listening-port=5349

# TURN relay range (must be published/open on the host). This is coturn's
# own UDP relay allocation range.
min-port=49152
max-port=65535

fingerprint

# RFC 5766-style time-limited credentials minted by the VoIP TURN credential
# actions from TURN_STATIC_SECRET — no static username/password list.
use-auth-secret
static-auth-secret=CHANGE_ME_TURN_STATIC_SECRET

realm=CHANGE_ME_TURN_REALM

# TLS certificate for TURN-over-TLS (5349), mounted from TURN_CERTS_DIR.
cert=/etc/coturn/certs/wss.pem
pkey=/etc/coturn/certs/wss.key

# Set to this host's real public IP in production.
# external-ip=CHANGE_ME_PUBLIC_IP

no-cli
no-tlsv1
no-tlsv1_1
