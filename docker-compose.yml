name: chatbotx

x-network: &network
  networks:
    - chatbotx-network

x-rustfs-environment: &rustfs-environment
  RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-chatbotx}
  RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-secretkey}
  RUSTFS_API_CORS_ALLOW_ORIGIN: ${RUSTFS_API_CORS_ALLOW_ORIGIN:-*}

services:
  postgres:
    <<: *network
    image: timescale/timescaledb-ha:pg18-all
    ports:
      - "5432:5432"
    volumes:
      - db-data:/home/postgres/pgdata
    command: ["postgres", "-c", "log_statement=${POSTGRES_LOG_STATEMENT:-none}"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-chatbotx}
      - POSTGRES_USER=${POSTGRES_USER:-chatbotx}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secretkey}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  adminer:
    <<: *network
    image: adminer:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"

  mailhog:
    <<: *network
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025

  filesystem:
    <<: *network
    image: rustfs/rustfs:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      <<: *rustfs-environment
    volumes:
      - filesystem-data:/data
    healthcheck:
      test: [
          "CMD",
          "sh",
          "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f
          http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  filesystem-init:
    <<: *network
    image: rustfs/rc:latest
    depends_on:
      filesystem:
        condition: service_healthy
    environment:
      <<: *rustfs-environment
    entrypoint: >
      /bin/sh -c "rc alias set local http://filesystem:9000
      $${RUSTFS_ACCESS_KEY} $${RUSTFS_SECRET_KEY}; rc mb local/chatbotx
      --ignore-existing; touch /tmp/empty && rc cp /tmp/empty
      local/chatbotx/public/; rc anonymous set public local/chatbotx/public;"

  redis:
    <<: *network
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-ui:
    <<: *network
    image: redis/redisinsight:latest
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5540:5540"
    volumes:
      - redis-ui-data:/data

  # TURN relay for in-app WhatsApp VoIP calling (browser WebRTC ICE).
  # Production-only: not started by default in local compose (local dev uses
  # host/STUN candidates) — enable with `--profile production`. The real
  # production stack (Docker Swarm, host networking, wide RTP range) lives in
  # the deployment repo, not here.
  coturn:
    profiles: ["production"]
    image: coturn/coturn:4.18.0-alpine
    # turnserver.conf does not expand ${} itself; the secret and realm are
    # passed as CLI flags, which override the file's placeholder lines.
    # TURN_STATIC_SECRET/TURN_REALM must be real values before this profile is
    # actually started in production — `:-CHANGE_ME` here only keeps
    # `docker compose config` usable without failing interpolation for a
    # service local dev never starts.
    #
    # Host networking is required: the TURN relay range (49152-65535/udp)
    # is thousands of ports and cannot be sensibly published through
    # Docker's bridge network. The host firewall must open 3478/udp+tcp,
    # 5349/udp+tcp, and 49152-65535/udp.
    network_mode: host
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_STATIC_SECRET:-CHANGE_ME_TURN_STATIC_SECRET}"
      - "--realm=${TURN_REALM:-chatbotx.local}"
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      # Holds wss.pem/wss.key for TURN-over-TLS (5349).
      - ${TURN_CERTS_DIR:-./.data/certs}:/etc/coturn/certs:ro

networks:
  chatbotx-network:
    driver: bridge

volumes:
  db-data:
  filesystem-data:
  cache-data:
  redis-ui-data:
